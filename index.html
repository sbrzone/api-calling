<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kimi Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app" data-theme="dark">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">☾</span>
        <span class="brand-name">Kimi Chat</span>
      </div>

      <button class="new-chat-btn" id="newChatBtn">+ New conversation</button>

      <div class="sidebar-section">
        <label for="apiKey">Kimi API key</label>
        <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" />
        <p class="hint">Stored only in this browser's localStorage. Never sent anywhere except api.moonshot.ai.</p>
      </div>

      <div class="sidebar-section">
        <label for="systemPrompt">Personality / system prompt</label>
        <textarea id="systemPrompt" rows="5" placeholder="e.g. You are a concise, friendly coding tutor who explains with examples.">You are a helpful, friendly assistant.</textarea>
      </div>

      <div class="sidebar-section">
        <label for="temperature">Creativity <span id="tempValue">0.6</span></label>
        <input type="range" id="temperature" min="0" max="1.2" step="0.1" value="0.6" />
      </div>

      <div class="sidebar-section">
        <label for="modelSelect">Model</label>
        <select id="modelSelect">
          <option value="kimi-k2.6" selected>kimi-k2.6 (fast)</option>
          <option value="kimi-k3">kimi-k3 (flagship)</option>
        </select>
      </div>

      <div class="sidebar-section toggle-row">
        <label for="themeToggle">Light mode</label>
        <input type="checkbox" id="themeToggle" />
      </div>

      <div class="sidebar-footer">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusText">No API key set</span>
      </div>
    </aside>

    <main class="chat-panel">
      <header class="chat-header">
        <h1>What can I help you build tonight?</h1>
        <div class="header-actions">
          <button id="regenerateBtn" title="Regenerate last response">↻ Regenerate</button>
          <button id="clearBtn" title="Clear conversation">🗑 Clear</button>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <div class="composer">
        <textarea id="userInput" placeholder="Message Kimi…" rows="1"></textarea>
        <button id="sendBtn" aria-label="Send message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="disclaimer">Kimi can make mistakes. Verify important information. Runs fully in your browser — your API key is only used for direct calls to api.moonshot.ai.</p>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
